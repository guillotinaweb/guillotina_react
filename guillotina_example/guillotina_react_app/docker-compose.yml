services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: guillotina
      POSTGRES_USER: guillotina
      POSTGRES_PASSWORD: postgres
    ports:
      # Host 5532 avoids clashing with a local Postgres on 5432 (matches CI / example Makefile)
      - "127.0.0.1:5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guillotina -d guillotina"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  guillotina:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
