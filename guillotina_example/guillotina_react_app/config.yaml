---
applications:
  - guillotina_react_app
databases:
  db:
    storage: postgresql
    dsn: postgresql://guillotina:postgres@localhost:5532/guillotina
    read_only: false
host: 0.0.0.0
port: 8080
root_user:
  password: root
auth_extractors:
  - guillotina.auth.extractors.BearerAuthPolicy
  - guillotina.auth.extractors.BasicAuthPolicy
  - guillotina.auth.extractors.WSTokenAuthPolicy
auth_token_validators:
  - guillotina.auth.validators.SaltedHashPasswordValidator
  - guillotina.auth.validators.JWTValidator
cors:
  allow_origin:
    - http://localhost:5173
    - http://localhost:4173
    - http://localhost:8080
    - http://localhost:3000
    - http://127.0.0.1:5173
    - http://127.0.0.1:4173
    - http://127.0.0.1:8080
    - http://127.0.0.1:3000
    - "chrome-extension://*"
  allow_methods:
    - GET
    - POST
    - DELETE
    - HEAD
    - PATCH
    - PUT
    - OPTIONS
  allow_headers:
    - "*"
  expose_headers:
    - "*"
  allow_credentials: true
  max_age: 3660
jwt:
  secret: foobar
  algorithm: HS256
  token_expiration: 86400

load_catalog: true
load_utilities:
  catalog:
    provides: guillotina.interfaces.ICatalogUtility
    factory: guillotina.contrib.catalog.pg.utility.PGSearchUtility