name: E2E Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  playwright-run:
    name: Run Playwright E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Start Guillotina services
        run: pnpm guillotina:up

      - name: Wait for Guillotina
        run: |
          # Wait until @login succeeds (same path the app uses), not only until the port accepts TCP.
          for i in {1..90}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H 'Content-Type: application/json' \
              -d '{"username":"root","password":"root"}' \
              http://127.0.0.1:8080/@login || echo "000")
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f guillotina_example/guillotina_react_app/docker-compose.yml logs guillotina
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies and browsers
        run: pnpm e2e:install

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
