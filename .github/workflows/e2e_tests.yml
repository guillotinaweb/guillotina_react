name: E2E Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  cypress-run:
    name: Run Cypress E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_DB=guillotina \
            -e POSTGRES_USER=guillotina \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:5532:5432 \
            postgres:18

      - name: Build Guillotina Docker image
        run: docker build -t guillotina_e2e .
        working-directory: guillotina_example/guillotina_react_app

      - name: Run Guillotina
        run: |
          docker run -d \
            --link=postgres \
            -p 0.0.0.0:8080:8080 \
            --name guillotina \
            guillotina_e2e:latest

      - name: Install dependencies
        run: pnpm install

      - name: Install E2E dependencies
        run: pnpm install
        working-directory: e2e

      - name: Build playground
        run: pnpm build:playground

      - name: Start preview server
        run: pnpm preview &
        working-directory: playground

      - name: Wait for preview server
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:4173; do sleep 2; done'

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 120

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: e2e/cypress/videos
          retention-days: 7

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e/cypress/screenshots
          retention-days: 7