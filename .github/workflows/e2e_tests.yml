name: E2E Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  playwright-run:
    name: Run Playwright E2E tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_DB=guillotina \
            -e POSTGRES_USER=guillotina \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:5532:5432 \
            postgres:18

      - name: Build Guillotina Docker image
        run: docker build -t guillotina_e2e .
        working-directory: guillotina_example/guillotina_react_app

      - name: Run Guillotina
        run: |
          docker run -d \
            --link=postgres \
            -p 0.0.0.0:8080:8080 \
            --name guillotina \
            guillotina_e2e:latest

      - name: Wait for Guillotina
        run: |
          for i in {1..60}; do
            if curl -s http://127.0.0.1:8080 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs guillotina
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile
        working-directory: e2e

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
        working-directory: e2e

      - name: Run Playwright tests
        run: pnpm playwright:test
        working-directory: e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
